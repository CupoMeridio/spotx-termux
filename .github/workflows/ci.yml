name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: |
          status=0
          for f in install.sh uninstall.sh src/*.sh src/guest/*.sh tests/*.sh; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; status=1; }
          done
          exit $status

      - name: ShellCheck
        # Preinstalled on ubuntu-latest; configuration in .shellcheckrc
        run: |
          shellcheck --version
          shellcheck --severity=warning install.sh uninstall.sh src/*.sh src/guest/*.sh tests/*.sh

      - name: Test suite
        run: bash tests/run-tests.sh

  # Publishing a release = bumping VERSION on main. Once the checks above pass, the
  # commit is tagged v<VERSION>; installer and updater download from that immutable
  # tag (src/common.sh: use_release_ref). Pushes that do not change VERSION are not
  # releases: the existing tag keeps pointing at the previously released commit.
  tag-release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag v<VERSION> if it does not exist yet
        run: |
          ver="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$ver" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error file=VERSION::invalid version '$ver' (expected YYYY.MM.DD[.N])"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${ver}" >/dev/null; then
            echo "Tag v${ver} already exists: not a new release (bump VERSION to publish)."
          else
            git tag "v${ver}"
            git push origin "v${ver}"
            echo "Released v${ver}."
          fi
